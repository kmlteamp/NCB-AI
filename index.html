<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>NCB-AI</title>

<style>
*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
}

body{
    font-family:Arial,sans-serif;
    background:#eef2f7;
}

.app{
    width:100%;
    height:100vh;
    display:flex;
    flex-direction:column;
    background:white;
}

.header{
    height:68px;
    display:flex;
    align-items:center;
    padding:9px 14px;
    background:white;
    border-bottom:1px solid #ddd;
}

.avatar{
    width:46px;
    height:46px;
    border-radius:50%;
    object-fit:cover;
    margin-right:11px;
    border:2px solid #111;
}

.name{
    font-size:20px;
    font-weight:bold;
}

.status{
    color:#20a447;
    font-size:13px;
    margin-top:3px;
}

.chat{
    flex:1;
    overflow-y:auto;
    padding:15px 12px;
    background:#f4f6f9;
}

.message{
    display:flex;
    width:100%;
    margin-bottom:14px;
}

.ai{
    justify-content:flex-start;
}

.user{
    justify-content:flex-end;
}

.content{
    display:flex;
    align-items:flex-end;
    gap:7px;
    max-width:90%;
}

.user .content{
    flex-direction:row-reverse;
}

.msg-avatar{
    width:31px;
    height:31px;
    border-radius:50%;
    object-fit:cover;
}

.bubble{
    padding:11px 14px;
    border-radius:17px;
    font-size:15px;
    line-height:1.5;
    white-space:pre-wrap;
    word-break:break-word;
}

.ai .bubble{
    background:#fff;
    color:#111;
    border:1px solid #ddd;
    border-bottom-left-radius:5px;
}

.user .bubble{
    background:#111;
    color:#fff;
    border-bottom-right-radius:5px;
}

.quick{
    padding:8px 12px;
    border-top:1px solid #eee;
}

.quick button{
    padding:9px 15px;
    border:1px solid #ccc;
    border-radius:20px;
    background:white;
    font-size:14px;
}

.input-area{
    display:flex;
    gap:8px;
    padding:10px;
    border-top:1px solid #ddd;
}

.input{
    flex:1;
    height:45px;
    border:1px solid #ccc;
    border-radius:23px;
    outline:none;
    padding:0 16px;
    font-size:15px;
    background:#f5f5f5;
}

.send{
    width:45px;
    height:45px;
    border:0;
    border-radius:50%;
    background:#111;
    color:white;
    font-size:20px;
}

.send:disabled{
    opacity:.5;
}

.typing{
    display:flex;
    gap:4px;
}

.dot{
    width:6px;
    height:6px;
    background:#777;
    border-radius:50%;
    animation:blink 1.2s infinite;
}

.dot:nth-child(2){
    animation-delay:.2s;
}

.dot:nth-child(3){
    animation-delay:.4s;
}

@keyframes blink{
    0%,80%,100%{
        opacity:.3;
    }
    40%{
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="app">

<div class="header">

<img
class="avatar"
src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWIfjgbrzcACUkgXyYLLNBlP--ZKC_79-ZBKwkFLeX4A&s"
>

<div>

<div class="name">NCB-AI</div>

<div class="status">
● Đang hoạt động
</div>

</div>

</div>


<div class="chat" id="chat">

<div class="message ai">

<div class="content">

<img
class="msg-avatar"
src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWIfjgbrzcACUkgXyYLLNBlP--ZKC_79-ZBKwkFLeX4A&s"
>

<div class="bubble">
Xin chào! Tôi là NCB-AI. Bạn cần tôi hỗ trợ gì?
</div>

</div>

</div>

</div>


<div class="quick">

<button onclick="quickMessage('Chào bạn')">
Chào bạn
</button>

</div>


<div class="input-area">

<input
id="input"
class="input"
type="text"
placeholder="Nhập tin nhắn..."
autocomplete="off"
>

<button
id="send"
class="send"
onclick="sendMessage()"
>
➤
</button>

</div>

</div>


<script>

/* ==========================================
   DÁN API KEY GOOGLE AI STUDIO Ở ĐÂY
   ========================================== */

const API_KEY = "DAN_API_KEY_CUA_BAN_VAO_DAY";


/* MODEL */

const MODEL = "gemini-2.5-flash";


/* AVATAR */

const AVATAR =
"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWIfjgbrzcACUkgXyYLLNBlP--ZKC_79-ZBKwkFLeX4A&s";


const chat =
document.getElementById("chat");

const input =
document.getElementById("input");

const send =
document.getElementById("send");


/* ==========================================
   THÊM TIN NHẮN
   ========================================== */

function addMessage(text,type){

    const message =
    document.createElement("div");

    message.className =
    "message " + type;


    const content =
    document.createElement("div");

    content.className =
    "content";


    if(type === "ai"){

        const avatar =
        document.createElement("img");

        avatar.className =
        "msg-avatar";

        avatar.src =
        AVATAR;

        content.appendChild(avatar);
    }


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";

    bubble.textContent =
    text;


    content.appendChild(bubble);

    message.appendChild(content);

    chat.appendChild(message);


    chat.scrollTop =
    chat.scrollHeight;
}


/* ==========================================
   ĐANG TRẢ LỜI
   ========================================== */

function showTyping(){

    const message =
    document.createElement("div");

    message.className =
    "message ai";

    message.id =
    "typing";


    const content =
    document.createElement("div");

    content.className =
    "content";


    const avatar =
    document.createElement("img");

    avatar.className =
    "msg-avatar";

    avatar.src =
    AVATAR;


    const bubble =
    document.createElement("div");

    bubble.className =
    "bubble";


    const typing =
    document.createElement("div");

    typing.className =
    "typing";


    typing.innerHTML =
        '<span class="dot"></span>' +
        '<span class="dot"></span>' +
        '<span class="dot"></span>';


    bubble.appendChild(typing);

    content.appendChild(avatar);

    content.appendChild(bubble);

    message.appendChild(content);

    chat.appendChild(message);


    chat.scrollTop =
    chat.scrollHeight;
}


function removeTyping(){

    const typing =
    document.getElementById("typing");

    if(typing){
        typing.remove();
    }
}


/* ==========================================
   CHỜ 8 GIÂY
   ========================================== */

function wait8(){

    return new Promise(
        function(resolve){

            setTimeout(
                resolve,
                8000
            );

        }
    );
}


/* ==========================================
   TIN NHẮN NHANH
   ========================================== */

function quickMessage(text){

    input.value = text;

    sendMessage();
}


/* ==========================================
   GỬI TIN NHẮN
   ========================================== */

async function sendMessage(){

    const text =
    input.value.trim();


    if(!text){
        return;
    }


    send.disabled = true;

    input.disabled = true;


    addMessage(
        text,
        "user"
    );

    input.value = "";


    /* CHÀO BẠN */

    if(
        text.toLowerCase()
        === "chào bạn"
    ){

        showTyping();

        await wait8();

        removeTyping();

        addMessage(
            "Chào bạn cần tôi hỗ trợ gì?",
            "ai"
        );

        send.disabled = false;

        input.disabled = false;

        input.focus();

        return;
    }


    /* KIỂM TRA KEY */

    if(
        !API_KEY ||
        API_KEY.trim() === "" ||
        API_KEY ===
        "AQ.Ab8RN6L1ZiC14L01scUKy6oLjh9uXlB_Qd9BzRVgz2MwoccO9Q"
    ){

        addMessage(
            "API key chưa được nhập trong code.",
            "ai"
        );

        send.disabled = false;

        input.disabled = false;

        return;
    }


    showTyping();


    try{

        const url =
        "https://generativelanguage.googleapis.com/v1beta/models/"
        + MODEL
        + ":generateContent?key="
        + encodeURIComponent(API_KEY);


        const body = {

            contents:[

                {
                    role:"user",

                    parts:[

                        {
                            text:
                            "Bạn là NCB-AI, trợ lý AI tiếng Việt. " +
                            "Hỗ trợ lập trình HTML, CSS, JavaScript, Python, Lua và Roblox Lua. " +
                            "Trả lời rõ ràng, hữu ích. " +
                            "Không hướng dẫn truy cập trái phép hoặc phá bảo mật.\n\n" +
                            "Người dùng hỏi: " +
                            text
                        }

                    ]
                }

            ],

            generationConfig:{

                temperature:0.7,

                maxOutputTokens:2048

            }

        };


        const response =
        await fetch(
            url,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                    "application/json"
                },

                body:
                JSON.stringify(body)
            }
        );


        const data =
        await response.json();


        if(!response.ok){

            console.log(
                "Gemini API:",
                data
            );

            let errorMessage =
                "Gemini API trả về lỗi.";

            if(
                data.error &&
                data.error.message
            ){

                errorMessage =
                    data.error.message;
            }

            throw new Error(
                errorMessage
            );
        }


        let answer = "";


        if(
            data.candidates &&
            data.candidates.length > 0 &&
            data.candidates[0].content &&
            data.candidates[0].content.parts
        ){

            answer =
            data.candidates[0]
            .content
            .parts
            .map(
                function(part){
                    return part.text || "";
                }
            )
            .join("");
        }


        if(!answer){

            answer =
            "NCB-AI không nhận được câu trả lời.";
        }


        /* CHỜ 8 GIÂY */

        await wait8();


        removeTyping();


        addMessage(
            answer,
            "ai"
        );


    }catch(error){

        console.error(error);

        removeTyping();


        addMessage(
            "Lỗi kết nối Gemini: " +
            error.message,
            "ai"
        );
    }


    send.disabled = false;

    input.disabled = false;

    input.focus();
}


/* ENTER */

input.addEventListener(
    "keydown",
    function(e){

        if(e.key === "Enter"){

            e.preventDefault();

            sendMessage();
        }

    }
);

</script>

</body>
</html>
