<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10131a">
<title>NCB_AI 1.0</title>
<style>
:root{
  --bg:#10131a;--panel:#171b25;--panel2:#202633;--border:#303746;
  --text:#f1f4fa;--muted:#929db2;--purple:#7657ee;--purple2:#5540b8;--green:#35d69a;
}
*{box-sizing:border-box}
html,body{overscroll-behavior:none;-webkit-overflow-scrolling:touch}
body{
  margin:0;font-family:Inter,system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;
  position:fixed;width:100%;touch-action:manipulation;
}
button,textarea,input{font:inherit}
button{cursor:pointer}
.app{height:100%;display:flex}
.sidebar{
  width:260px;flex-shrink:0;background:#131722;border-right:1px solid var(--border);
  padding:16px;display:flex;flex-direction:column;gap:16px;transition:transform .2s;position:relative;
}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px}
.logo{width:38px;height:38px;display:grid;place-items:center;background:var(--purple);border-radius:12px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.new-chat{width:100%;border:1px solid #51447f;border-radius:10px;background:#28213f;color:#e4dcff;padding:12px;text-align:left}
.section-label{color:var(--muted);font-size:12px;margin:8px 0}
.history-list{display:flex;flex-direction:column;gap:5px;overflow:auto;flex:1}
.history-item{
  padding:10px;border-radius:8px;color:#c8d0df;font-size:13px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer;
  display:flex;align-items:center;justify-content:space-between;gap:6px;
}
.history-item:hover,.history-item.active{background:#27243d}
.history-item .title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.history-item .del-x{
  flex-shrink:0;width:18px;height:18px;display:grid;place-items:center;
  border-radius:50%;background:#3a2a3a;color:#ff8888;font-size:11px;font-weight:700;
  line-height:1;cursor:pointer;opacity:.6;transition:all .2s;
}
.history-item .del-x:hover{background:#aa0000;color:#fff;opacity:1}
.sidebar-bottom{
  margin-top:auto;border-top:1px solid var(--border);padding-top:14px;
  color:var(--muted);font-size:12px;line-height:1.8;
}
.sidebar-bottom .admin{color:#ffd166;font-weight:700}
.sidebar-bottom .version{color:#a78bfa;font-weight:700}
.sidebar-bottom .counter{color:#35d69a;font-weight:700}
.sidebar-close{
  display:none;position:absolute;top:10px;right:10px;width:30px;height:30px;
  border:1px solid var(--border);background:#1a1f2b;color:#fff;border-radius:8px;
  font-size:16px;font-weight:700;place-items:center;cursor:pointer;z-index:5;
}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{
  height:68px;flex-shrink:0;padding:0 22px;display:flex;align-items:center;gap:13px;
  border-bottom:1px solid var(--border);background:rgba(23,27,37,.95);
}
.icon-btn{
  width:38px;height:38px;border:1px solid var(--border);background:transparent;
  color:var(--text);border-radius:10px;display:grid;place-items:center;
}
.top-title{font-weight:700;font-size:15px}
.top-subtitle{font-size:12px;color:var(--muted);margin-top:3px}
.status{margin-left:auto;display:flex;align-items:center;gap:7px;color:#aab5c9;font-size:12px}
.status-dot{width:7px;height:7px;background:var(--green);border-radius:50%}
.status.error .status-dot{background:#ff626e}
.messages{flex:1;overflow-y:auto;padding:28px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y}
.content{max-width:780px;width:100%;margin:0 auto}
.welcome{min-height:350px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
.welcome-logo{
  width:66px;height:66px;border-radius:22px;display:grid;place-items:center;
  background:linear-gradient(135deg,#8a6cff,#5436c9);box-shadow:0 10px 45px #7657ee30;
  margin-bottom:20px;overflow:hidden;
}
.welcome-logo img{width:100%;height:100%;object-fit:cover;display:block}
.welcome h1{font-size:clamp(25px,4vw,34px);margin:0 0 12px;letter-spacing:-1px}
.welcome .ver{color:#a78bfa;font-size:13px;font-weight:700;margin-bottom:6px;letter-spacing:2px}
.welcome p{color:var(--muted);line-height:1.7;max-width:440px;font-size:14px;margin:0}
.suggestions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;width:100%;margin-top:30px}
.suggestion{
  text-align:left;background:#171b25;border:1px solid var(--border);color:#d7ddec;
  border-radius:13px;padding:15px;transition:border-color .2s,background .2s;
}
.suggestion:hover{border-color:#7860ce;background:#201c30}
.suggestion strong{display:block;font-size:13px;margin-bottom:6px}
.suggestion span{display:block;color:var(--muted);font-size:12px;line-height:1.5}
.message{display:flex;align-items:flex-start;gap:11px;margin:0 0 25px}
.message.user{justify-content:flex-end}
.avatar{
  flex-shrink:0;width:31px;height:31px;display:grid;place-items:center;
  border-radius:10px;background:var(--purple);font-size:16px;overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block;border-radius:10px}
.message.user .avatar{background:#394355}
.bubble-wrap{min-width:0;max-width:calc(100% - 45px);display:flex;flex-direction:column;gap:6px;}
.message.user .bubble-wrap{align-items:flex-end;}
.bubble{
  min-width:0;padding:12px 15px;border-radius:14px;
  background:var(--panel2);color:#e6eaf2;font-size:14px;line-height:1.8;
  white-space:pre-wrap;overflow-wrap:anywhere;
}
.message.user .bubble{background:var(--purple2);color:white;border-top-right-radius:5px}
.message.assistant .bubble{border:1px solid #30394b;border-top-left-radius:5px}

/* NHẬP... ANIMATION */
.typing-dots{
  display:inline-flex;
  align-items:center;
  gap:4px;
}
.typing-dots span{
  width:6px;height:6px;border-radius:50%;
  background:#9c8bfa;
  animation:typingPulse 1s infinite alternate;
}
.typing-dots span:nth-child(2){animation-delay:.2s}
.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes typingPulse{to{opacity:.25;transform:translateY(-3px)}}
.typing-label{
  color:#aab5c9;
  font-size:13px;
  font-style:italic;
  margin-left:4px;
}

.image-gen-box{
  background:linear-gradient(135deg,#0d1220,#131a2e);
  border:1px solid var(--purple);border-radius:16px;padding:14px;margin-top:6px;
  box-shadow:0 8px 30px rgba(118,87,238,.2);max-width:100%;
}
.image-prompt-label{color:var(--muted);font-size:11px;font-weight:700;letter-spacing:1.5px;margin-bottom:8px}
.image-prompt-text{
  color:#e6eaf2;font-size:13px;line-height:1.6;
  padding:10px 12px;background:#0a0e18;border-radius:8px;
  margin-bottom:12px;border:1px solid var(--border);
  font-family:'Courier New',monospace;
}
.image-loading{padding:30px;text-align:center;color:var(--muted);font-size:13px}
.image-loading .spinner{
  width:40px;height:40px;margin:0 auto 12px;
  border:3px solid var(--border);border-top-color:var(--purple);
  border-radius:50%;animation:spin 1s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}
.image-result{width:100%;border-radius:12px;overflow:hidden;background:#0a0e18;border:1px solid var(--border);position:relative}
.image-result img{width:100%;height:auto;display:block;border-radius:12px}
.image-actions{display:flex;gap:6px;margin-top:10px}
.image-actions button{
  flex:1;padding:9px;border:1px solid #30394b;
  background:#171b25;color:#aab5c9;border-radius:8px;
  font-size:12px;font-weight:600;cursor:pointer;transition:all .15s;
}
.image-actions button:hover{border-color:var(--purple);color:#fff}
.image-actions .save-btn:hover{border-color:var(--green);color:var(--green)}

.clock-box{
  background:linear-gradient(135deg,#0d1220,#131a2e);
  border:1px solid var(--purple);border-radius:16px;padding:20px;margin-top:6px;
  box-shadow:0 8px 30px rgba(118,87,238,.2);min-width:260px;
}
.clock-label{
  color:var(--muted);font-size:11px;font-weight:700;
  letter-spacing:2px;margin-bottom:12px;display:flex;align-items:center;gap:6px;
}
.clock-label::before{content:'';width:8px;height:8px;background:var(--green);border-radius:50%;animation:typingPulse 2s infinite}
.clock-time{
  font-family:'Courier New',monospace;font-size:42px;font-weight:700;
  color:#fff;letter-spacing:2px;line-height:1;margin-bottom:6px;
  text-shadow:0 0 20px rgba(118,87,238,.5);display:flex;align-items:baseline;gap:2px;
}
.clock-time .sec{color:var(--green);font-size:32px}
.clock-date{color:#a78bfa;font-size:14px;font-family:'Courier New',monospace;margin-bottom:10px;letter-spacing:1px}
.clock-tz{color:var(--muted);font-size:11px;padding:5px 10px;background:#0a0e18;border-radius:6px;display:inline-block;border:1px solid var(--border)}

.code-block{background:#0a0e16;border:1px solid #30394b;border-radius:10px;margin:10px 0;overflow:hidden}
.code-header{
  display:flex;justify-content:space-between;align-items:center;
  padding:8px 12px;background:#0d1220;border-bottom:1px solid #30394b;
  color:#929db2;font-size:11px;font-family:'Courier New',monospace;
}
.code-header .lang{color:#a78bfa;font-weight:700;letter-spacing:1px}
.code-copy{
  background:#171b25;border:1px solid #30394b;color:#aab5c9;
  padding:4px 10px;border-radius:6px;font-size:11px;cursor:pointer;transition:all .15s;
}
.code-copy:hover{border-color:var(--purple);color:#fff}
.code-copy.active{border-color:var(--green);color:var(--green)}
.code-content{
  padding:14px;overflow-x:auto;color:#e6eaf2;
  font-family:'Courier New',Consolas,monospace;
  font-size:13px;line-height:1.6;white-space:pre;tab-size:2;
}
.msg-actions{display:flex;gap:6px;padding:0 4px;flex-wrap:wrap}
.msg-actions button{
  background:#171b25;border:1px solid #30394b;color:#aab5c9;
  padding:5px 10px;border-radius:8px;font-size:11px;
  cursor:pointer;transition:all .15s;
  display:flex;align-items:center;gap:4px;
}
.msg-actions button:hover{border-color:var(--purple);color:#fff;background:#201c30}
.msg-actions button.active{border-color:var(--green);color:var(--green)}
.composer-area{flex-shrink:0;padding:12px 18px 18px;background:linear-gradient(transparent,var(--bg) 15%)}
.composer-wrap{max-width:780px;margin:auto}
.composer{border:1px solid #41495b;border-radius:17px;background:#171b25;padding:12px;transition:border-color .2s}
.composer:focus-within{border-color:#8068eb}
#input{
  display:block;width:100%;min-height:42px;max-height:180px;resize:none;
  border:0;outline:0;background:transparent;color:var(--text);font-size:14px;line-height:1.6;
}
#input::placeholder{color:#7f8ba0}
.composer-bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:7px}
.composer-info{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}
.send-btn{
  width:39px;height:39px;display:grid;place-items:center;border:0;border-radius:12px;
  background:var(--purple);color:white;font-size:19px;transition:background .2s;
}
.send-btn:hover{background:#8c75ff}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.disclaimer{text-align:center;font-size:11px;color:#747f94;margin:10px 0 0}
.toast{
  position:fixed;left:50%;bottom:105px;transform:translateX(-50%);
  background:#303747;color:#fff;border:1px solid #4b566b;padding:11px 16px;
  border-radius:10px;font-size:13px;z-index:10;max-width:90%;text-align:center;
}
.hidden{display:none!important}
.ncb-overlay{
  position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.75);
  display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);
}
.ncb-box{
  width:300px;padding:18px;background:#0c1630;border:1px solid #00cfff;
  border-radius:12px;box-shadow:0 0 20px #007bff44, 0 20px 60px rgba(0,0,0,.6);
  position:relative;font-family:Arial,sans-serif;color:#fff;
}
.ncb-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.ncb-top b{color:#40deff;font-size:16px}
.ncb-close{
  border:0;background:#202c48;color:#fff;width:27px;height:27px;border-radius:6px;
  font-size:17px;cursor:pointer;display:grid;place-items:center;
}
.ncb-close:hover{background:#aa0000}
.ncb-input{
  width:100%;padding:12px;border-radius:7px;border:1px solid #22568a;
  background:#070f22;color:#fff;outline:none;
  font-family:'Courier New',monospace;letter-spacing:2px;
}
.ncb-input:focus{border-color:#00cfff;box-shadow:0 0 0 3px rgba(0,207,255,.15)}
.ncb-submit{
  width:100%;padding:11px;margin-top:12px;border:0;border-radius:7px;color:white;
  background:linear-gradient(90deg,#008cff,#653cff);font-weight:bold;cursor:pointer;
}
.ncb-submit:hover{filter:brightness(1.15)}
.ncb-msg{font-size:12px;color:#76ddff;margin-top:10px;min-height:16px;text-align:center}
.quiz-card{background:#0d1017;border:1px solid #30394b;border-radius:14px;padding:18px;margin-top:6px}
.quiz-header{color:#a78bfa;font-size:12px;font-weight:700;letter-spacing:2px;margin-bottom:10px}
.quiz-question{color:#f1f4fa;font-size:16px;font-weight:700;margin-bottom:16px;line-height:1.6}
.quiz-options{display:flex;flex-direction:column;gap:8px}
.quiz-btn{
  text-align:left;background:#171b25;border:1px solid #41495b;
  color:#e6eaf2;padding:12px 14px;border-radius:10px;
  font-size:14px;cursor:pointer;transition:all .15s;
}
.quiz-btn:hover{border-color:var(--purple);background:#201c30}
.quiz-btn:disabled{cursor:default;opacity:.7}
.quiz-btn.correct{border-color:#35d69a;background:#0f2a22;color:#35d69a}
.quiz-btn.wrong{border-color:#ff626e;background:#2a0f12;color:#ff626e}
.quiz-footer{margin-top:14px;display:flex;justify-content:space-between;align-items:center;color:#929db2;font-size:12px}
.quiz-next{background:var(--purple);color:#fff;border:0;padding:8px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.quiz-next:hover{background:#8c75ff}
@media(max-width:700px){
  .sidebar{position:fixed;z-index:20;left:0;top:0;bottom:0;box-shadow:15px 0 45px #0007;transform:translateX(-105%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-close{display:grid}
  .topbar{height:60px;padding:0 13px}
  .messages{padding:20px 13px}
  .composer-area{padding:10px 12px 13px}
  .welcome{min-height:320px}
  .welcome h1{font-size:27px}
  .suggestions{grid-template-columns:1fr;margin-top:23px}
  .suggestion{padding:12px}
  .bubble{font-size:13px;padding:10px 12px}
  .quiz-question{font-size:15px}
  .quiz-btn{font-size:13px;padding:10px 12px}
  .code-content{font-size:12px;padding:12px}
  .clock-time{font-size:34px}
  .clock-time .sec{font-size:26px}
  .clock-date{font-size:13px}
  .clock-box{padding:16px;min-width:auto}
}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar">
    <button class="sidebar-close" id="sidebarClose">✕</button>
    <div class="brand">
      <div class="logo"><img src="https://i.ibb.co/9kBTwhfq/file-000000007ae482099bddf96408f8a67f.png" alt="NCB_AI"></div>
      <span>NCB_AI 1.0</span>
    </div>
    <button class="new-chat" id="newChat">＋ &nbsp; Cuộc trò chuyện mới</button>
    <div>
      <div class="section-label">GẦN ĐÂY</div>
      <div class="history-list" id="historyList"></div>
    </div>
    <div class="sidebar-bottom">
      <div>✦ NCB_AI</div>
      <div class="version">Phiên bản 1.0</div>
      <div>Trợ lý AI tiếng Việt</div>
      <div id="modelLabel">Model: Auto fallback</div>
      <div class="admin">Admin: NGUYỄN CÔNG BẰNG</div>
      <div class="counter" id="counterLabel">Lượt chat: 0 / 50000</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="menuBtn">☰</button>
      <div>
        <div class="top-title">NCB_AI 1.0</div>
        <div class="top-subtitle">Trợ lý AI của NGUYỄN CÔNG BẰNG</div>
      </div>
      <div class="status" id="status">
        <span class="status-dot"></span>
        <span id="statusText">Đang kết nối</span>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="content" id="content"></div>
    </section>

    <section class="composer-area">
      <div class="composer-wrap">
        <div class="composer">
          <textarea id="input" rows="1" maxlength="12000" placeholder="Nhắn tin... (/image tạo ảnh, /encbminigame chơi game)" aria-label="Tin nhắn"></textarea>
          <div class="composer-bottom">
            <div class="composer-info">
              <span>✦</span><span>NCB_AI 1.0</span><span>·</span><span>Enter để gửi</span>
            </div>
            <button class="send-btn" id="sendBtn">↑</button>
          </div>
        </div>
        <p class="disclaimer">NCB_AI có thể mắc lỗi. Hãy kiểm tra thông tin quan trọng.</p>
      </div>
    </section>
  </main>
</div>

<div class="toast hidden" id="toast"></div>

<div class="ncb-overlay hidden" id="codeOverlay">
  <div class="ncb-box">
    <div class="ncb-top">
      <b>⌘ NHẬP CODE</b>
      <button class="ncb-close" id="codeClose">×</button>
    </div>
    <input class="ncb-input" id="codeInput" placeholder="Nhập code..." autocomplete="off">
    <button class="ncb-submit" id="codeSubmit">XÁC NHẬN</button>
    <div class="ncb-msg" id="codeError"></div>
  </div>
</div>

const TIME_KEYWORDS = ['mấy giờ','mấy h','giờ hiện tại','giờ bây giờ','bây giờ là mấy giờ','hôm nay là ngày','hôm nay ngày','ngày hôm nay','ngày bao nhiêu','thứ mấy','thứ bao nhiêu','thời gian hiện tại','thời gian bây giờ','đồng hồ','xem giờ','cho tôi biết giờ','cho tôi biết ngày','giờ việt nam','giờ vn','date','time','ngày tháng','tháng mấy','năm nay','hiện tại là','giờ hệ thống','giờ máy'];

let clockIntervals = [];

function createClockWidget(){
  const box = document.createElement('div');
  box.className = 'clock-box';
  const label = document.createElement('div');
  label.className = 'clock-label'; label.textContent = 'THỜI GIAN THỰC';
  const timeEl = document.createElement('div'); timeEl.className = 'clock-time';
  const dateEl = document.createElement('div'); dateEl.className = 'clock-date';
  const tzEl = document.createElement('div'); tzEl.className = 'clock-tz';
  tzEl.textContent = '🇻🇳 Giờ Việt Nam (UTC+7)';
  box.appendChild(label); box.appendChild(timeEl); box.appendChild(dateEl); box.appendChild(tzEl);

  function update(){
    const now = new Date();
    const vn = new Date(now.getTime() + (now.getTimezoneOffset() * 60000) + (7 * 3600000));
    const hh = String(vn.getHours()).padStart(2, '0');
    const mm = String(vn.getMinutes()).padStart(2, '0');
    const ss = String(vn.getSeconds()).padStart(2, '0');
    timeEl.innerHTML = hh + ':' + mm + ':<span class="sec">' + ss + '</span>';
    const days = ['Chủ nhật','Thứ hai','Thứ ba','Thứ tư','Thứ năm','Thứ sáu','Thứ bảy'];
    const dd = String(vn.getDate()).padStart(2, '0');
    const mo = String(vn.getMonth() + 1).padStart(2, '0');
    dateEl.textContent = days[vn.getDay()] + ', ' + dd + '/' + mo + '/' + vn.getFullYear();
  }
  update();
  const id = setInterval(update, 1000);
  clockIntervals.push(id);
  const observer = new MutationObserver(() => {
    if(!document.body.contains(box)){ clearInterval(id); observer.disconnect(); }
  });
  observer.observe(document.body, { childList: true, subtree: true });
  return box;
}

// Chuyển đổi văn bản AI sang HTML có icon thay vì dấu ***
function formatAIText(text){
  if(typeof text !== 'string') return document.createTextNode(String(text));

  const container = document.createElement('div');
  const lines = text.split('\n');

  lines.forEach((line, idx) => {
    const trimmed = line.trim();

    // Dòng trống
    if(trimmed === ''){
      const br = document.createElement('div');
      br.style.height = '6px';
      container.appendChild(br);
      return;
    }

    // Phát hiện tiêu đề dạng "## Tiêu đề" hoặc "**Tiêu đề**"
    let isHead = false;
    let headText = '';

    const headM = trimmed.match(/^#{1,6}\s+(.+)$/);
    if(headM){
      isHead = true;
      headText = headM[1].replace(/\*\*/g, '').trim();
    }else{
      // **Tiêu đề** hoặc ***Tiêu đề***
      const boldM = trimmed.match(/^\*{2,3}([^*]+)\*{2,3}\s*:?\s*$/);
      if(boldM){
        isHead = true;
        headText = boldM[1].trim();
      }
    }

    if(isHead){
      const head = document.createElement('div');
      head.className = 'section-head';
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.textContent = '📌';
      const t = document.createElement('span');
      t.textContent = headText;
      head.appendChild(ic);
      head.appendChild(t);
      container.appendChild(head);
      return;
    }

    // Phát hiện dòng danh sách "- item" hoặc "* item" hoặc "• item"
    const listM = trimmed.match(/^[-*•]\s+(.+)$/);
    if(listM){
      const row = document.createElement('div');
      row.className = 'icon-line';
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.textContent = '🔹';
      const t = document.createElement('span');
      t.className = 'txt';
      t.textContent = listM[1].replace(/\*\*/g, '').replace(/\*/g, '');
      row.appendChild(ic);
      row.appendChild(t);
      container.appendChild(row);
      return;
    }

    // Đánh số "1. item"
    const numM = trimmed.match(/^(\d+)\.\s+(.+)$/);
    if(numM){
      const row = document.createElement('div');
      row.className = 'icon-line';
      const ic = document.createElement('span');
      ic.className = 'ic';
      ic.textContent = numM[1] + '.';
      ic.style.color = '#a78bfa';
      ic.style.fontWeight = '700';
      const t = document.createElement('span');
      t.className = 'txt';
      t.textContent = numM[2].replace(/\*\*/g, '').replace(/\*/g, '');
      row.appendChild(ic);
      row.appendChild(t);
      container.appendChild(row);
      return;
    }

    // Dòng thường — xử lý ***Bold*** và *italic* inline
    const lineEl = document.createElement('div');
    let cleanText = trimmed
      .replace(/\*{2,3}([^*]+)\*{2,3}/g, '$1')  // bỏ ***bold***
      .replace(/\*([^*\n]+)\*/g, '$1')          // bỏ *italic*
      .replace(/__([^_]+)__/g, '$1')
      .replace(/_([^_]+)_/g, '$1');
    lineEl.textContent = cleanText;
    container.appendChild(lineEl);
  });

  return container;
}

  avatar.className = "avatar";
  if(role === "user"){

    img.onerror = () => { avatar.textContent = "●"; };
    avatar.appendChild(img);
  }else{

    avatar.appendChild(img);
  }

  const wrap = document.createElement("div");
  wrap.className = "bubble-wrap";
  const bubble = document.createElement("div");
  bubble.className = "bubble";

  if(role === "assistant"){
    const parts = parseMessage(text);
    parts.forEach(p => {
      if(p.type === 'code') bubble.appendChild(renderCodeBlock(p.lang, p.content));
      else if(p.content.trim().length > 0) bubble.appendChild(formatAIText(p.content));
    });
  }else{
    bubble.textContent = text;
  }

  wrap.appendChild(bubble);

  if(role === "assistant" && typeof text === "string" && text.trim().length > 0){
    const actions = document.createElement("div");
    actions.className = "msg-actions";

    const copyBtn = document.createElement("button");
    copyBtn.innerHTML = '📋 <span>Copy</span>';
    copyBtn.addEventListener("click", () => {
      navigator.clipboard.writeText(text).then(() => {
        copyBtn.classList.add("active");
        copyBtn.innerHTML = '✅ <span>Đã copy</span>';
        showToast("Đã sao chép câu trả lời");
        setTimeout(() => {
          copyBtn.classList.remove("active");
          copyBtn.innerHTML = '📋 <span>Copy</span>';
        }, 1500);
      });
    });
    actions.appendChild(copyBtn);

    const speakBtn = document.createElement("button");
    speakBtn.innerHTML = '🔊 <span>Nghe</span>';
    speakBtn.addEventListener("click", () => {
      if(!('speechSynthesis' in window)){ showToast("Trình duyệt không hỗ trợ đọc"); return; }
      if(window.speechSynthesis.speaking){
        window.speechSynthesis.cancel();
        speakBtn.classList.remove("active");
        speakBtn.innerHTML = '🔊 <span>Nghe</span>';
        return;
      }
      const parts = parseMessage(text);
      const speakText = parts.filter(p => p.type === 'text').map(p => p.content)
        .join(' ').replace(/\*+/g,'').replace(/#+/g,'').trim();
      if(!speakText){ showToast('Không có nội dung để đọc'); return; }
      const utter = new SpeechSynthesisUtterance(speakText);
      utter.lang = 'vi-VN';
      const voices = window.speechSynthesis.getVoices();
      const viVoice = voices.find(v => v.lang.startsWith('vi'));
      if(viVoice) utter.voice = viVoice;
      utter.onstart = () => { speakBtn.classList.add("active"); speakBtn.innerHTML = '⏸ <span>Dừng</span>'; };
      utter.onend = utter.onerror = () => { speakBtn.classList.remove("active"); speakBtn.innerHTML = '🔊 <span>Nghe</span>'; };
      window.speechSynthesis.speak(utter);
    });
    actions.appendChild(speakBtn);

    wrap.appendChild(actions);
  }

  if(role === "user"){ row.appendChild(wrap); row.appendChild(avatar); }
  else{ row.appendChild(avatar); row.appendChild(wrap); }

  contentEl.appendChild(row);
  scrollBottom();
  return row;
}

          </button>
          <button class="suggestion" data-prompt="Bây giờ là mấy giờ?">
            <strong>🕐 Xem giờ</strong><span>Đồng hồ thực VN</span>
          </button>
          <button class="suggestion" data-prompt="Tôi cần hỗ trợ">
            <strong>☻ Trò chuyện</strong><span>Liên hệ admin</span>
          </button>
        </div>
      </div>`;
    return;
  }
  currentMessages.forEach(m => {
    if(m.role === "assistant" && m.isSupport) renderSupportMessage();
    else if(m.role === "assistant" && m.isMiniGame) renderMiniGame();
    else if(m.role === "assistant" && m.isTime) renderTimeMessage(m.content);
    else renderMessage(m.role, m.content);
  });
}

function saveCurrent(){
  if(!activeId || currentMessages.length === 0) return;
  const conversation = conversations.find(c => c.id === activeId);
  if(!conversation) return;
  conversation.messages = currentMessages.map(m => ({...m}));
  const firstUser = currentMessages.find(m => m.role === "user");
  conversation.title = firstUser ? firstUser.content.slice(0, 35) : "Cuộc trò chuyện mới";
  saveHistoryToStorage();
  renderHistory();
}

function renderHistory(){
  historyList.replaceChildren();
  conversations.slice().reverse().forEach(c => {
    const item = document.createElement("div");
    item.className = "history-item" + (c.id === activeId ? " active" : "");
    item.title = c.title;
    const title = document.createElement("span");
    title.className = "title"; title.textContent = c.title;
    const delX = document.createElement("span");
    delX.className = "del-x"; delX.textContent = "✕";
    delX.addEventListener("click", (e) => { e.stopPropagation(); deleteConversation(c.id); });
    item.appendChild(title); item.appendChild(delX);
    item.addEventListener("click", () => openConversation(c.id));
    historyList.appendChild(item);
  });
}

function deleteConversation(id){
  if(busy) return;
  const idx = conversations.findIndex(c => c.id === id);
  if(idx === -1) return;
  conversations.splice(idx, 1);
  saveHistoryToStorage();
  if(id === activeId){
    if(conversations.length > 0){
      const last = conversations[conversations.length - 1];
      activeId = last.id;
      currentMessages = last.messages.map(m => ({...m}));
    }else{
      activeId = makeId();
      currentMessages = [];
      conversations.push({id: activeId, title: "Cuộc trò chuyện mới", messages: []});
    }
  }
  renderHistory();
  renderConversation();
  showToast("Đã xóa cuộc trò chuyện");
}

function newConversation(){
  if(busy) return;
  saveCurrent();
  activeId = makeId();
  currentMessages = [];
  conversations.push({id: activeId, title: "Cuộc trò chuyện mới", messages: []});
  saveHistoryToStorage();
  renderConversation();
  renderHistory();
  closeSidebar();
  input.focus();
}

function openConversation(id){
  if(busy) return;
  saveCurrent();
  const c = conversations.find(x => x.id === id);
  if(!c) return;
  activeId = c.id;
  currentMessages = c.messages.map(m => ({...m}));
  renderConversation();
  renderHistory();
  closeSidebar();
}

function closeSidebar(){ sidebar.classList.remove("open"); }

function randInt(min, max){ return Math.floor(Math.random() * (max - min + 1)) + min; }
function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
function generateMathQuiz(){
  const types = ['add','sub','mul','div','mix'];
  const type = types[randInt(0, types.length - 1)];
  let question = '', answer = 0;
  if(type === 'add'){ const a = randInt(10, 99), b = randInt(10, 99); question = a + ' + ' + b + ' = ?'; answer = a + b; }
  else if(type === 'sub'){ const a = randInt(50, 200), b = randInt(10, a - 1); question = a + ' - ' + b + ' = ?'; answer = a - b; }
  else if(type === 'mul'){ const a = randInt(2, 12), b = randInt(2, 12); question = a + ' × ' + b + ' = ?'; answer = a * b; }
  else if(type === 'div'){ const b = randInt(2, 12), result = randInt(2, 12), a = b * result; question = a + ' ÷ ' + b + ' = ?'; answer = result; }
  else{ const a = randInt(2, 10), b = randInt(2, 10), c = randInt(1, 20); question = a + ' × ' + b + ' + ' + c + ' = ?'; answer = a * b + c; }
  const wrongSet = new Set();
  while(wrongSet.size < 3){ const offset = randInt(-20, 20); const wrong = answer + offset; if(wrong !== answer && wrong > 0) wrongSet.add(wrong); }
  const options = [{ text: String(answer), correct: true }, ...Array.from(wrongSet).map(v => ({ text: String(v), correct: false }))];
  const shuffled = shuffle(options);
  const letters = ['A','B','C','D'];
  const finalOptions = shuffled.map((o, i) => ({ letter: letters[i], text: o.text, correct: o.correct }));
  const correctLetter = finalOptions.find(o => o.correct).letter;
  return { question, options: finalOptions, correct: correctLetter };
}

function parseMessage(text){
  if(typeof text !== 'string') return [{ type: 'text', content: String(text) }];
  const parts = [];
  const regex = /```([a-zA-Z0-9_+\-#.]*)\n?([\s\S]*?)```/g;
  let lastIndex = 0;
  let match;
  while((match = regex.exec(text)) !== null){
    const before = text.slice(lastIndex, match.index);
    if(before.trim().length > 0) parts.push({ type: 'text', content: before });
    parts.push({ type: 'code', lang: (match[1] || 'code').toLowerCase(), content: match[2].replace(/\n$/, '') });
    lastIndex = regex.lastIndex;
  }
  const after = text.slice(lastIndex);
  if(after.trim().length > 0) parts.push({ type: 'text', content: after });
  if(parts.length === 0) parts.push({ type: 'text', content: text });
  return parts;
}

function renderCodeBlock(lang, code){
  const wrap = document.createElement('div');
  wrap.className = 'code-block';
  const header = document.createElement('div');
  header.className = 'code-header';
  const langEl = document.createElement('span');
  langEl.className = 'lang'; langEl.textContent = (lang || 'code').toUpperCase();
  const copyBtn = document.createElement('button');
  copyBtn.className = 'code-copy'; copyBtn.textContent = '📋 Copy code';
  copyBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(code).then(() => {
      copyBtn.classList.add('active'); copyBtn.textContent = '✅ Đã copy';
      showToast('Đã sao chép code');
      setTimeout(() => { copyBtn.classList.remove('active'); copyBtn.textContent = '📋 Copy code'; }, 1500);
    });
  });
  header.appendChild(langEl); header.appendChild(copyBtn);
  const pre = document.createElement('pre');
  pre.className = 'code-content'; pre.textContent = code;
  wrap.appendChild(header); wrap.appendChild(pre);
  return wrap;
}

async function callOneModel(cfg, messagesForApi, userText){
  const headers = { 'Authorization': 'Bearer ' + API_KEY, 'Content-Type': 'application/json' };
  const maxTokens = getMaxTokensForRequest(userText);
  const response = await fetch(API_URL, {
    method: "POST",
    headers: headers,
    body: JSON.stringify({
      model: cfg.model, messages: messagesForApi,
      temperature: 0.9, top_p: 0.95, max_tokens: maxTokens, stream: false
    })
  });
  if(!response.ok){
    const errText = await response.text();
    const err = new Error("HTTP " + response.status + ": " + errText.slice(0,180));
    err.status = response.status;
    throw err;
  }
  const data = await response.json();
  if(!data || !data.choices || !data.choices[0] || !data.choices[0].message) throw new Error("Phản hồi không hợp lệ");
  const reply = data.choices[0].message.content;
  if(typeof reply !== "string" || reply.trim().length === 0) throw new Error("Phản hồi rỗng");
  return reply;
}

async function callApiWithFallback(messagesForApi, userText){
  let lastError = null;
  const total = MODEL_FALLBACK_CHAIN.length;
  for(let i = 0; i < total; i++){
    const cfg = MODEL_FALLBACK_CHAIN[i];
    try{
      setStatus("Đang xử lý (" + (i+1) + "/" + total + ")");
      const reply = await callOneModel(cfg, messagesForApi, userText);
      return { ok: true, reply: reply, model: cfg.model };
    }catch(err){
      lastError = err;
      if(err.status === 401 || err.status === 400) return { ok: false, error: err, fatal: true };
      if(i < total - 1) await sleep(800);
    }
  }
  return { ok: false, error: lastError };
}

    const downloadBtn = document.createElement("button");

      const a = document.createElement('a');

      a.target = '_blank';
      a.click();
    });

    regenBtn.addEventListener('click', () => { imgEl.src = buildImageUrl(prompt); });

    const openBtn = document.createElement("button");

    actions.appendChild(regenBtn);

    });

      content: '❌ Không tạo được ảnh cho: "' + prompt + '". Lỗi: ' + e.message
    });

  }
}

async function sendMessage(textOverride){
  if(busy) return;
  if(getChatCount() >= getMaxChat()){
    renderUnlockMessage();
    showToast("Đã hết lượt chat. Nhập code để tiếp tục.");
    return;
  }
  const text = (textOverride ?? input.value).trim();
  if(!text) return;

  if(!activeId){
    activeId = makeId();
    conversations.push({id: activeId, title: "Cuộc trò chuyện mới", messages: []});
  }
  currentMessages.push({ role: "user", content: text });
  if(currentMessages.length === 1){
    const c = conversations.find(x => x.id === activeId);
    if(c) c.title = text.slice(0,35);
  }
  input.value = "";
  input.style.height = "42px";
  renderConversation();
  renderHistory();

  // /encbminigame
  if(text.toLowerCase() === MINIGAME_CMD){
    busy = true; sendBtn.disabled = true;
    const row = renderTypingIndicator();
    await sleep(700); row.remove();
    renderMiniGame();
    setChatCount(getChatCount() + 1);
    saveCurrent();
    setStatus("Đã kết nối");
    busy = false; sendBtn.disabled = false; input.focus();
    return;
  }

  // :codencb
  if(text.toLowerCase() === CODE_CMD){
    busy = true; sendBtn.disabled = true;
    const row = renderTypingIndicator();
    await sleep(500); row.remove();
    openCodeModal();
    currentMessages.push({ role: "assistant", content: "🔑 Đã mở khung nhập code.", isCodePrompt: true });
    setChatCount(getChatCount() + 1);
    saveCurrent();
    setStatus("Đã kết nối");
    busy = false; sendBtn.disabled = false; input.focus();
    return;
  }

  // HỎI NGÀY GIỜ
  if(isTimeQuestion(text) && !isImageRequest(text)){
    busy = true; sendBtn.disabled = true;
    const row = renderTypingIndicator();
    await sleep(600); row.remove();
    const introMsg = "🕐 Đây là thời gian hiện tại nhé:";
    renderTimeMessage(introMsg);
    currentMessages.push({ role: "assistant", content: introMsg, isTime: true });
    setChatCount(getChatCount() + 1);
    saveCurrent();
    setStatus("Đã kết nối");
    busy = false; sendBtn.disabled = false; input.focus();
    return;
  }

  // HỖ TRỢ
  if(isSupportQuestion(text)){
    busy = true; sendBtn.disabled = true;
    const row = renderTypingIndicator();
    await sleep(900); row.remove();
    renderSupportMessage();
    currentMessages.push({ role: "assistant", content: "💬 Hỗ trợ qua Facebook nhé!", isSupport: true });
    setChatCount(getChatCount() + 1);
    saveCurrent();
    setStatus("Đã kết nối");
    busy = false; sendBtn.disabled = false; input.focus();
    return;
  }

  // TẠO ẢNH
  if(isImageRequest(text)){
    const prompt = extractImagePrompt(text);
    if(!prompt){
      renderMessage("assistant", "🎨 Bạn muốn tạo ảnh gì? Gõ /image + mô tả (ví dụ: /image con mèo dễ thương).");
      setChatCount(getChatCount() + 1);
      saveCurrent();
      return;
    }
    busy = true; sendBtn.disabled = true;
    await handleImageGeneration(prompt);
    setChatCount(getChatCount() + 1);
    saveCurrent();
    setStatus("Đã kết nối");
    busy = false; sendBtn.disabled = false; input.focus();
    return;
  }

  // CHAT BÌNH THƯỜNG — dùng "Đang nhập..."
  busy = true; sendBtn.disabled = true;
  const row = renderTypingIndicator();

  const waitMs = getResponseDelay(text);
  const history = currentMessages.slice(-30).map(m => ({ role: m.role, content: m.content }));
  const messagesForApi = [{ role: "system", content: SYSTEM_PROMPT }, ...history];

  const apiPromise = callApiWithFallback(messagesForApi, text);
  const delayPromise = sleep(waitMs);
  const [result] = await Promise.all([apiPromise, delayPromise]);

  let reply;
  if(result.ok){ reply = result.reply; setStatus("Đã kết nối"); }
  else{
    reply = pickFallbackReply();
    setStatus("Lỗi kết nối", true);
    showToast(result.fatal ? "❌ API key sai hoặc hết hạn." : "⏳ Tất cả model đều quá tải. Thử lại sau.");
  }

  setChatCount(getChatCount() + 1);
  currentMessages.push({ role: "assistant", content: reply });

  saveCurrent();
  row.remove();
  renderMessage("assistant", reply);

  if(getChatCount() >= getMaxChat()) renderUnlockMessage();
  busy = false; sendBtn.disabled = false; input.focus();
}
