<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#10131a">
<title>NCB_AI 1.5.0</title>
<!-- FONT ICON MATERIAL -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=mood,redeem" />
<style>
/* THÊM STYLE MATERIAL SYMBOLS THEO YÊU CẦU */
.material-symbols-outlined {
  font-variation-settings:
  'FILL' 0,
  'wght' 400,
  'GRAD' 0,
  'opsz' 24
}

:root{--bg:#10131a;--panel:#171b25;--panel2:#202633;--border:#303746;--text:#f1f4fa;--muted:#929db2;--purple:#7657ee;--purple2:#5540b8;--green:#35d69a;--red:#ff3d5a;--yellow:#ffd166}
*{box-sizing:border-box}
html,body{overscroll-behavior:none}
body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text);height:100dvh;overflow:hidden;position:fixed;width:100%}
button{cursor:pointer}button,textarea,input{font:inherit}
.login-screen{position:fixed;inset:0;z-index:1000;background:linear-gradient(135deg,#0a0a1a,#10131a,#0d1420);display:flex;align-items:center;justify-content:center;padding:20px;transition:.4s}
.login-screen.hide{opacity:0;pointer-events:none;transform:scale(1.05)}
.login-box{background:var(--panel);border:1px solid var(--border);border-radius:24px;padding:40px 28px;max-width:400px;width:100%;text-align:center;box-shadow:0 30px 90px rgba(118,87,238,.25);position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:conic-gradient(from 0deg,transparent,#7657ee,transparent,#a78bfa,transparent);animation:rotateGlow 8s linear infinite;opacity:.08;z-index:0}
@keyframes rotateGlow{to{transform:rotate(360deg)}}
.login-content{position:relative;z-index:1}
.login-logo{width:80px;height:80px;margin:0 auto 20px;border-radius:24px;background:linear-gradient(135deg,#8a6cff,#5436c9);display:grid;place-items:center;box-shadow:0 12px 45px rgba(118,87,238,.6);overflow:hidden;animation:logoFloat 3s ease-in-out infinite}
.login-logo img{width:100%;height:100%;object-fit:cover;display:block}
@keyframes logoFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.login-title{font-size:26px;font-weight:900;margin-bottom:8px;background:linear-gradient(135deg,#fff,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.login-sub{color:var(--muted);font-size:14px;line-height:1.7;margin-bottom:28px}
.ncb-login-btn{width:100%;height:52px;background:linear-gradient(135deg,#7657ee,#5540b8);color:#fff;border:0;border-radius:12px;font-size:16px;font-weight:800;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .2s;box-shadow:0 6px 25px rgba(118,87,238,.5);letter-spacing:1px}
.ncb-login-btn:hover{transform:translateY(-2px);box-shadow:0 8px 35px rgba(118,87,238,.8)}
.ncb-login-btn svg{width:24px;height:24px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ncb-login-btn .loading{display:none;width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin 1s linear infinite}
.ncb-login-btn.loading .loading{display:block}
.ncb-login-btn.loading svg{display:none}
@keyframes spin{to{transform:rotate(360deg)}}

.login-error { color: var(--red); font-size: 12px; font-weight: 600; min-height: 18px; margin-top: 15px; }

.saved-info{margin-top:16px;padding:12px;background:#0d1017;border:1px solid var(--border);border-radius:12px;text-align:center}
.saved-label{color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px}
.saved-id{color:var(--green);font-size:14px;font-weight:800;font-family:'Courier New',monospace;word-break:break-all}
.login-footer{margin-top:22px;padding-top:18px;border-top:1px solid var(--border);color:var(--muted);font-size:11px;line-height:1.7}
.login-footer strong{color:#ffd166}
.app{height:100%;display:flex}
.sidebar{width:260px;flex-shrink:0;background:#131722;border-right:1px solid var(--border);padding:16px;display:flex;flex-direction:column;gap:16px;transition:transform .2s;position:relative}
.brand{display:flex;align-items:center;gap:10px;font-weight:750;font-size:17px}
.logo{width:38px;height:38px;display:grid;place-items:center;background:var(--purple);border-radius:12px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover;display:block}
.user-card{display:flex;align-items:center;gap:10px;padding:10px;background:#0d1017;border:1px solid var(--border);border-radius:12px}
.user-avatar{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#8a6cff,#5436c9);display:grid;place-items:center;color:#fff;font-weight:700;font-size:12px;overflow:hidden;flex-shrink:0;border:2px solid rgba(255,255,255,.1);font-family:'Courier New',monospace}
.user-info{min-width:0;flex:1}
.user-name{color:var(--text);font-size:11px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'Courier New',monospace;cursor:pointer;transition:color 0.2s;}
.user-name:hover { color: var(--green); }
.user-email{color:var(--muted);font-size:9px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.logout-btn{background:transparent;border:1px solid #3a2a3a;color:#ff8888;padding:6px 10px;border-radius:8px;font-size:11px;cursor:pointer;transition:all .15s;font-weight:700}
.logout-btn:hover{background:#aa0000;color:#fff;border-color:#aa0000}
.new-chat{width:100%;border:1px solid #51447f;border-radius:10px;background:#28213f;color:#e4dcff;padding:12px;text-align:left;cursor:pointer}
