<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NCB-AI</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
}

body {
    font-family: Arial, sans-serif;
    background: #eef2f7;
    display: flex;
    justify-content: center;
    align-items: center;
}

.app {
    width: 100%;
    max-width: 900px;
    height: 100vh;
    background: #fff;
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* HEADER */

.header {
    height: 70px;
    min-height: 70px;
    background: #111827;
    color: white;

    display: flex;
    align-items: center;

    padding: 0 18px;
    gap: 12px;
}

.ai-avatar {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    object-fit: cover;
    border: 2px solid white;
}

.header-name {
    font-size: 19px;
    font-weight: bold;
}

.online {
    font-size: 12px;
    color: #22c55e;
    margin-top: 3px;
}

/* CHAT */

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 18px;
    background: #f5f7fb;
}

.message {
    display: flex;
    gap: 9px;
    margin-bottom: 18px;
}

.message.you {
    justify-content: flex-end;
}

.message.ai {
    justify-content: flex-start;
}

.message-content {
    max-width: 80%;
}

.name {
    font-size: 12px;
    font-weight: bold;
    color: #6b7280;
    margin-bottom: 5px;
}

.you .name {
    text-align: right;
}

.bubble {
    padding: 12px 15px;
    border-radius: 17px;
    line-height: 1.5;
    word-wrap: break-word;
    white-space: pre-wrap;
}

.ai .bubble {
    background: white;
    border: 1px solid #e5e7eb;
    color: #111827;
    border-top-left-radius: 5px;
}

.you .bubble {
    background: #2563eb;
    color: white;
    border-top-right-radius: 5px;
}

/* TYPING */

.typing {
    display: none;
    margin-bottom: 15px;
}

.typing-bubble {
    display: inline-block;
    background: white;
    border: 1px solid #e5e7eb;
    border-radius: 15px;
    padding: 10px 14px;
    color: #777;
}

/* QUICK */

.quick-area {
    padding: 9px 14px 5px;
    background: white;
    border-top: 1px solid #e5e7eb;
}

.quick-title {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 6px;
}

.quick-btn {
    border: 1px solid #dbe2ea;
    background: #f8fafc;
    padding: 8px 13px;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
}

.quick-btn:hover {
    background: #eef2ff;
}

/* INPUT */

.input-area {
    display: flex;
    gap: 8px;
    padding: 12px 14px;
    background: white;
}

.input {
    flex: 1;
    min-width: 0;

    border: 1px solid #d1d5db;
    outline: none;

    padding: 12px 15px;
    border-radius: 24px;

    font-size: 15px;
}

.input:focus {
    border-color: #2563eb;
}

.send-btn {
    width: 46px;
    height: 46px;

    border: none;
    border-radius: 50%;

    background: #2563eb;
    color: white;

    font-size: 19px;

    cursor: pointer;
}

.send-btn:hover {
    background: #1d4ed8;
}

.send-btn:active {
    transform: scale(.94);
}

.send-btn:disabled {
    opacity: .6;
    cursor: not-allowed;
}

/* MOBILE */

@media (max-width: 600px) {

    .header {
        height: 64px;
        min-height: 64px;
    }

    .ai-avatar {
        width: 42px;
        height: 42px;
    }

    .header-name {
        font-size: 17px;
    }

    .chat {
        padding: 13px;
    }

    .message-content {
        max-width: 85%;
    }

    .bubble {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="app">

    <!-- HEADER -->

    <div class="header">

        <img
            class="ai-avatar"
            src="https://i.ibb.co/9HSwGJfb/inbound1817149894862564692.png"
            alt="NCB-AI"
        >

        <div>
            <div class="header-name">
                NCB-AI
            </div>

            <div class="online">
                ● Online
            </div>
        </div>

    </div>


    <!-- CHAT -->

    <div class="chat" id="chat">

        <div class="message ai">

            <img
                class="ai-avatar"
                src="https://i.ibb.co/9HSwGJfb/inbound1817149894862564692.png"
                alt="NCB-AI"
                style="width:36px;height:36px;"
            >

            <div class="message-content">

                <div class="name">
                    NCB-AI
                </div>

                <div class="bubble">
                    Chào bạn! Bạn cần gì, nói tôi sẽ hỗ trợ bạn.
                </div>

            </div>

        </div>


        <!-- TYPING -->

        <div
            class="typing"
            id="typing"
        >

            <div class="typing-bubble">
                NCB-AI đang trả lời...
            </div>

        </div>

    </div>


    <!-- QUICK MESSAGE -->

    <div class="quick-area">

        <div class="quick-title">
            Tin nhắn nhanh
        </div>

        <button
            class="quick-btn"
            onclick="quickMessage()"
        >
            Chào bạn?
        </button>

    </div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            id="messageInput"
            class="input"
            type="text"
            placeholder="Chat với NCB-AI..."
            autocomplete="off"
        >

        <button
            id="sendButton"
            class="send-btn"
            onclick="sendMessage()"
        >
            ➤
        </button>

    </div>

</div>


<script>

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const typing = document.getElementById("typing");
const sendButton = document.getElementById("sendButton");

let conversation = [];


/*
THÊM TIN NHẮN
*/

function addMessage(text, type) {

    const message = document.createElement("div");

    message.className = "message " + type;

    if (type === "ai") {

        message.innerHTML = `
            <img
                class="ai-avatar"
                src="https://i.ibb.co/9HSwGJfb/inbound1817149894862564692.png"
                alt="NCB-AI"
                style="width:36px;height:36px;"
            >

            <div class="message-content">

                <div class="name">
                    NCB-AI
                </div>

                <div class="bubble"></div>

            </div>
        `;

    } else {

        message.innerHTML = `
            <div class="message-content">

                <div class="name">
                    YOU
                </div>

                <div class="bubble"></div>

            </div>
        `;
    }

    message.querySelector(".bubble").textContent = text;

    chat.insertBefore(message, typing);

    chat.scrollTop = chat.scrollHeight;
}


/*
TIN NHẮN NHANH
*/

function quickMessage() {

    addMessage(
        "Chào bạn?",
        "you"
    );

    setTimeout(() => {

        addMessage(
            "Chào bạn! Bạn cần gì, nói tôi sẽ hỗ trợ bạn.",
            "ai"
        );

    }, 500);
}


/*
GỬI TIN NHẮN
*/

async function sendMessage() {

    const text = input.value.trim();

    if (!text) {
        return;
    }

    addMessage(
        text,
        "you"
    );

    input.value = "";

    showTyping();

    sendButton.disabled = true;


    try {

        const response = await fetch(
            "/api/chat",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    message: text,

                    history: conversation

                })
            }
        );


        const data = await response.json();


        if (!response.ok) {

            throw new Error(
                data.error ||
                "Không thể kết nối NCB-AI."
            );

        }


        const reply = data.reply;


        if (!reply) {

            throw new Error(
                "NCB-AI không trả về câu trả lời."
            );

        }


        hideTyping();

        addMessage(
            reply,
            "ai"
        );


        /*
        LƯU LỊCH SỬ CHAT
        */

        conversation.push({

            role: "user",

            text: text

        });


        conversation.push({

            role: "model",

            text: reply

        });


        /*
        GIỚI HẠN LỊCH SỬ
        */

        if (conversation.length > 20) {

            conversation =
                conversation.slice(-20);

        }

    }

    catch (error) {

        hideTyping();

        addMessage(
            "Xin lỗi, NCB-AI đang gặp lỗi: " +
            error.message,
            "ai"
        );

    }


    sendButton.disabled = false;

    input.focus();
}


/*
ENTER ĐỂ GỬI
*/

input.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/*
ĐANG TRẢ LỜI
*/

function showTyping() {

    typing.style.display = "block";

    chat.scrollTop =
        chat.scrollHeight;
}


function hideTyping() {

    typing.style.display = "none";

}

</script>

</body>
</html>
